name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis and test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats jq
      - name: Run checks
        run: make check
